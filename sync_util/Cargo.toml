[package]
name = "sync_util"
version = "0.1.0"
edition = "2024"
description = "Allinea una cartella di destinazione al contenuto della sorgente (versione Rust di Dimensions Sync)"

[lib]
name = "sync_util"
path = "src/lib.rs"

[[bin]]
name = "dimensions-sync"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
encoding_rs = "0.8.44"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.18.0"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
